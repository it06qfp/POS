name: POS Daily Lark Report (Test)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/lark-report-threads
    paths:
      - .github/workflows/pos-daily-report-test.yml

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Thai fonts (for rendering the report image)
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run POS Daily report with the test bot
        env:
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          LARK_APP_ID: ${{ secrets.APP_ID_TEST }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET_TEST }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID_TEST }}
        run: python scripts/coda_lark_report.py
