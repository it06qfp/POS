name: POS Daily Lark Report

on:
  schedule:
    - cron: '0 1 * * *'        # 01:00 UTC = 08:00 Asia/Bangkok
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Thai fonts (for rendering the report image)
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run POS Daily report (TEST secrets only)
        env:
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN_TEST }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID_TEST }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET_TEST }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID_TEST }}
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL_TEST }}
          LARK_EXTERNAL_WEBHOOK_URL: ${{ secrets.LARK_EXTERNAL_WEBHOOK_URL_TEST }}
        run: python scripts/coda_lark_report.py
