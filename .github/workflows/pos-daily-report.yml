name: POS Daily Lark Report

on:
  schedule:
    - cron: '0 1 * * *'        # 01:00 UTC = 08:00 Asia/Bangkok
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Thai fonts (for rendering the report image)
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run POS Daily report (TEST secrets only)
        env:
          # CODA token has no _TEST variant in the repo; uses the existing one.
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          LARK_APP_ID: ${{ secrets.APP_ID_TEST }}
          LARK_APP_SECRET: ${{ secrets.APP_SECRET_TEST }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID_TEST }}
          # Alert webhook has no _TEST variant; optional (skipped if unset).
          LARK_ALERT_WEBHOOK_URL: ${{ secrets.LARK_ALERT_WEBHOOK_URL }}
          LARK_EXTERNAL_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL_TEST }}
        run: python scripts/coda_lark_report.py

      - name: Commit latest Lark thread metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain -- latest_thread.json)" ]]; then
            echo "latest_thread.json was not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_thread.json
          git commit -m "chore: update latest Lark thread"
          git push
